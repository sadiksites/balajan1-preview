locale: ru
backend:
  name: git-gateway
  repo: sadiksites/balajan1-preview
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/39685c46-c30e-480d-8422-21da7907c93f/pkce
  auth_token_endpoint: /sites/39685c46-c30e-480d-8422-21da7907c93f/token
  gateway_url: https://gateway.decapbridge.com
  squash_merges: true
  commit_messages:
    create: 'CMS: создано {{slug}} — {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'CMS: изменено {{slug}} — {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'CMS: удалено {{slug}} — {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'CMS: фото {{path}} — {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'CMS: удалено фото {{path}} — {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: '{{message}} - {{author-name}} <{{author-login}}> via DecapBridge'
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url
site_url: https://sadiksites.github.io/balajan1-preview/
display_url: https://sadiksites.github.io/balajan1-preview/
logo_url: https://sadiksites.github.io/balajan1-preview/logo.svg
media_folder: img/uploads
public_folder: img/uploads
