<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>«Балажан-1» балабақшасы</title><link rel="icon" href="logo.svg">
<style>
:root{--teal:#2f6fb5;--teal-d:#1f4f86;--yel:#f2b631;--cor:#e8684a;--ink:#2d3a45;--mut:#6b7682;--bg:#fffaf3;--card:#fff;--r:18px;--max:1120px;--sh:0 8px 24px rgba(40,90,100,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;font:16px/1.6 "Segoe UI",Arial,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg)}img{max-width:100%;display:block}a{color:var(--teal-d)}
.wrap{max-width:var(--max);margin:auto;padding:0 20px}
.demo{background:var(--ink);color:#fff;font-size:12px;text-align:center;padding:3px;opacity:.85}
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.bar{height:5px;background:linear-gradient(90deg,var(--cor),var(--yel),var(--teal),var(--teal))}
.hi{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}.logo img{width:44px;height:44px}.logo b{display:block;font-size:18px;line-height:1.1}.logo small{color:var(--mut)}
nav{flex:1;display:flex;justify-content:flex-end;gap:2px;flex-wrap:wrap;min-width:0;height:40px;overflow:hidden}nav a{padding:8px 11px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}nav a:hover{background:#e8f0fa;color:var(--teal-d)}
.lang{display:flex;border:2px solid var(--teal);border-radius:10px;overflow:hidden;flex:none}.lang button{border:0;background:#fff;padding:6px 10px;font-weight:700;cursor:pointer;color:var(--teal-d)}.lang [aria-pressed=true]{background:var(--teal);color:#fff}
.burger{display:none;flex:none;width:42px;height:42px;border:0;border-radius:10px;background:#e8f0fa;font-size:22px;cursor:pointer}
.nb nav{position:fixed;top:73px;left:0;right:0;height:auto;flex-direction:column;background:#fff;padding:10px 20px 20px;box-shadow:var(--sh);display:none}.nb.open nav{display:flex}.nb .burger{display:block}.nb .hi{justify-content:space-between}.nb .lang{margin-left:auto}
.hero{padding:48px 0;background:linear-gradient(180deg,#e8f0fa,var(--bg))}.hero .wrap{display:grid;gap:32px;align-items:center}@media(min-width:860px){.hero .wrap{grid-template-columns:1fr 1.1fr}}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 12px}.hero p{color:var(--mut);font-size:18px}.hero img{border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:700;text-decoration:none;margin:6px 8px 0 0}.bp{background:var(--teal);color:#fff}.bg{border:2px solid var(--teal);color:var(--teal-d)}
section.s{padding:52px 0}section.s:nth-of-type(even){background:#fff}h2{font-size:30px;margin:0 0 20px}h2:after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:var(--yel);margin-top:8px}
.cards{list-style:none;padding:0;margin:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.cards li{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}.cards li span{color:var(--mut)}
.fi,.ge{font-size:30px}.cards.g li{border-top:6px solid var(--c)}
.av{width:56px;height:56px;border-radius:50%;background:#e8f0fa;color:var(--teal-d)!important;display:grid;place-items:center;font-weight:800;font-size:18px}
.news{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.news article{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}.news img{aspect-ratio:16/10;object-fit:cover;width:100%}.news div{padding:16px 18px}.news time{color:var(--cor);font-weight:700;font-size:14px}.news h3{margin:4px 0}
.docs{list-style:none;padding:0;margin:0;display:grid;gap:10px}.docs li{display:flex;justify-content:space-between;background:#fff;border:1px solid #e4ecee;border-radius:12px;padding:14px 18px}.docs a{text-decoration:none;font-weight:600}
.sym li svg{width:90px;height:60px}.note{color:var(--mut);font-size:14px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px}dt{font-weight:700}dd{margin:0}
figure.ph{margin:0;position:relative}figure.ph figcaption{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:4px 10px;border-radius:8px}.ct{display:grid;gap:24px}@media(min-width:860px){.ct{grid-template-columns:1fr 1fr}}.ct iframe{width:100%;height:320px;border:0;border-radius:var(--r)}dd{overflow-wrap:anywhere}footer{background:var(--ink);color:#cfd8dc;padding:24px 0;font-size:14px}
</style></head><body>
<div class="demo" data-t="demo"></div>
<header><div class="bar"></div><div class="wrap hi"><a class="logo" href="#top"><img src="logo.svg" alt=""><span><b data-t="brand"></b><small data-t="sub"></small></span></a><nav id="nav"></nav><span id="lang"></span><button class="burger" id="bg" aria-label="menu">☰</button></div></header>
<main id="top">
<section class="hero"><div class="wrap"><div><h1 data-t="heroT"></h1><p data-t="heroL"></p><p>📍 <span data-t="loc"></span></p><a class="btn bp" href="https://wa.me/77479539342" data-t="wa"></a><a class="btn bg" href="tel:+77263623101" data-t="call"></a></div><figure class="ph"><img src="hero.jpg" alt=""><figcaption data-t="photo"></figcaption></figure></div></section>
<section class="s" id="about"><div class="wrap"><h2 data-n="about"></h2><p data-t="aboutP"></p><ul class="cards" id="feats"></ul></div></section>
<section class="s" id="groups"><div class="wrap"><h2 data-n="groups"></h2><ul class="cards g" id="grp"></ul></div></section>
<section class="s" id="staff"><div class="wrap"><h2 data-n="staff"></h2><ul class="cards" id="stf"></ul></div></section>
<section class="s" id="docs"><div class="wrap"><h2 data-n="docs"></h2><ul class="docs" id="dcs"></ul><p class="note" data-t="docsNote"></p></div></section>
<section class="s" id="symbols"><div class="wrap"><h2 data-t="symT"></h2><ul class="cards sym" id="sym"></ul></div></section>
<section class="s" id="contacts"><div class="wrap"><h2 data-n="contacts"></h2><div class="ct"><div id="cnt"></div><div><h3 data-t="mapT"></h3><iframe title="map" loading="lazy" src="https://www.google.com/maps?q=%D0%9A%D0%B0%D0%BA%D0%BF%D0%B0%D1%82%D0%B0%D1%81%2C+%D0%9A%D0%BE%D1%80%D0%B4%D0%B0%D0%B9%D1%81%D0%BA%D0%B8%D0%B9+%D1%80%D0%B0%D0%B9%D0%BE%D0%BD&amp;output=embed"></iframe></div></div></div></section>
</main><footer><div class="wrap" data-t="foot"></div></footer>
<script src="data.js"></script><script src="render.js"></script><script>
const $=id=>document.getElementById(id),R=document.documentElement;
function fit(){R.classList.remove('nb');if(innerWidth<900){R.classList.add('nb');return}fitNav($('nav'),'nb')}
window.render=()=>{S.i18n();document.querySelectorAll('[data-n]').forEach(e=>e.textContent=S.title(e.dataset.n));$('nav').innerHTML=S.nav();$('lang').innerHTML=S.lang();$('feats').innerHTML=S.feats();$('grp').innerHTML=S.groups();$('stf').innerHTML=S.staff();$('dcs').innerHTML=S.docs();$('sym').innerHTML=S.sym();$('cnt').innerHTML=S.contacts();document.title=T('heroT');fit()};
render();addEventListener('resize',fit);addEventListener('load',fit);
$('bg').onclick=()=>R.classList.toggle('open');$('nav').onclick=()=>R.classList.remove('open');
</script></body></html>
